<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>יעלנט – הדמיית בחינה</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- מסך פתיחה -->
<section id="home" class="home">
  <div class="wordmark big"><span class="g">יעל</span><span class="o">נט</span></div>
  <h2>בחרו בחינה. בלחיצה על הכפתור הבחינה תחל.</h2>
  <div id="examList" class="exam-list"></div>
  <p class="disclaimer">אתר תרגול עצמאי להדמיית בחינה. אינו קשור למרכז הארצי לבחינות ולהערכה. הציון המוצג הוא הערכה בלבד.</p>
</section>

<!-- מסך בחינה -->
<div id="exam" hidden>
  <header class="topbar">
    <div class="tabs" id="tabs"></div>
    <div class="wordmark"><span class="g">יעל</span><span class="o">נט</span></div>
    <div class="timer" id="timer"><span class="clock">⏰</span><span id="timeText">20:00</span></div>
    <button id="nextSectionBtn" class="next-section"><span class="chev">‹</span> <span id="nextSectionLabel">לפרק הבא</span></button>
  </header>

  <div class="navbar" id="navbar">
    <button id="flagBtn" class="flag">📌 תזכורת</button>
    <div id="qnav" class="qnav"></div>
  </div>

  <main id="stage" class="stage">
    <button id="nextArrow" class="arrow side-next" aria-label="הבא">‹</button>
    <div class="side-label next-label">הבא</div>
    <div id="splitRight" class="passage-pane" hidden>
      <button class="pill" data-instr>הוראות</button>
      <div id="passage" class="passage"></div>
    </div>
    <div class="q-pane" id="qPane">
      <button class="pill" data-instr>הוראות</button>
      <h3 id="qTitle" class="q-title"></h3>
      <p id="qText" class="q-text"></p>
      <div id="opts" class="opts"></div>
    </div>
    <button id="prevArrow" class="arrow side-prev" aria-label="הקודם">›</button>
  </main>

  <section id="writing" class="writing" hidden>
    <h3>מטלת כתיבה</h3>
    <p id="writingPrompt"></p>
    <textarea id="writingText" rows="14"></textarea>
  </section>
</div>

<!-- חלון הוראות -->
<dialog id="instrDlg"><p id="instrText"></p><button onclick="this.closest('dialog').close()">סגור</button></dialog>

<div id="confirmBox" class="overlay" hidden><div class="box"><p id="confirmText"></p><div class="row"><button id="confirmYes" class="primary">כן, להמשיך</button><button id="confirmNo">ביטול</button></div></div></div>

<div id="pickBox" class="overlay" hidden><div class="box pick">
  <h3 id="pickTitle"></h3>
  <p>בחרו אילו חלקים לעשות:</p>
  <div class="row presets"><button id="pickFull">בחינה מלאה</button><button id="pickMc">שאלות סגורות בלבד</button><button id="pickW">הבעה בכתב בלבד</button></div>
  <div id="pickList" class="pklist"></div>
  <div class="row"><button id="pickGo" class="primary">להתחיל</button><button id="pickCancel">ביטול</button></div>
</div></div>

<!-- תוצאות -->
<section id="result" class="result" hidden>
  <div class="wordmark"><span class="g">יעל</span><span class="o">נט</span></div>
  <h2>תוצאות הבחינה</h2>
  <div id="summary" class="summary"></div>
  <div class="filters">
    <button data-f="all" class="on">הכול</button>
    <button data-f="wrong">טעויות</button>
    <button data-f="blank">לא נענו</button>
    <button data-f="vocab">אוצר מילים</button>
  </div>
  <div id="review"></div>
  <button id="homeBtn" class="primary">חזרה לרשימת הבחינות</button>
</section>

<script src="config.js"></script>
<script src="exams/b01.js"></script>
<script src="exams/b02.js"></script>
<script src="exams/b03.js"></script>
<script src="exams/b04.js"></script>
<script src="exams/b06.js"></script>
<script src="exams/b07.js"></script>
<script src="exams/b11.js"></script>
<script src="exams/b12.js"></script>
<script src="exams/b13.js"></script>
<script src="exams/b14.js"></script>
<script src="exams/b15.js"></script>
<script src="exams/b16.js"></script>
<script src="exams/b17.js"></script>
<script src="notes/b01.js"></script>
<script src="app.js"></script>
</body>
</html>
